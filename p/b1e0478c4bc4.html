<style>

h1{font-size:18px;margin:0 0 16px}
input[type=password]{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}

</style></head><body>
<form id="f" hidden><h1>合言葉を入力してください</h1>
<input id="p" type="password" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="r"> この端末で覚える（30日）<small>共有の端末では、印を付けないでください</small></label>
<button type="submit">開く</button><p id="m"></p></form>
<script>
const D={"salt":"IgYJQ/s8dedREjieGLJkiQ==","iv":"/x/ZQ9WgJKnBeJ3X","ct":"BdLk+DNYLA7Ch+2UXBJxKg0zVMYnmNlPnrVJu0Zz6KC5dIUAa/L+WxcDm0nlr7y5tphWe1RJ4L6RLCnP6JIMk/vSqXFgLvOdD6Mf6ygVj8J5PAlQ/uumDjV7I5XSqcl9qpU5XwLrCeCF/W5eXOB8BI6LpdKDioDqJOvHjgYNhCNpMjVOMUPfIj1r0+eyWhKJc2XYe2efhkjX/xvbYQyLCoPMPO5VIp+7CJK1naE9RSe4Kgm5xK5f6pp6RZUBCaWv342Aib8qRJS+VwIf7AlrGJYFRuZSKQYFM+7hH2NaEAPfO5VbHZEX6KP8CCLAx9fq2I71JwOBR9zXjWbBEnnbL2XYBOPpdt4084IKUww6YKgj/NR0k5Yxz4H4r+RTArc6JMxec9b08srmbxlA47JpK7mOB9d0gKsied0JUDfieF/IWWLTlL4Kcf8YPgc4qkJjuUV0wiByu/sZgd5NMVbwnIw+MXxjgti/JiNht44IAjUlB7r1LCYklrvIgbERZPREdRIULjQ5X8VCFeer+2NsPz92NMj3ovinOEJA1BQzR73iTnPf45WjYC7rtbza/SJubE9uve0SePr0Z424gNXhY2stFI0WvVYT2GM/U8BTFxEF/0+Pn1P+5npx2L53Np0TEHmgf7aP7BbzK5cTlukNIrrAH6xX/Pfqf3SaDzEIGwZc8SssMwlMhShH0Ec8JlUOU84w48lBA/wMxlzCRAkfAVUFYkAAfjKmopyYCfoBkBduX7SU2qO2LP2fNpTZYl61C4eJrVlK7GRcu63lz8pM+rZ+J6icsZ8T3yVZNYHpMnnmCAYdeRc8z87uviCeD03gE2Y7Wp8ImHscGu9+6TPqwdZNVewN2ZwWkYqN8AMCimfdrkIjFlg5qSGQd24u4HAaYY67OyPDhAbGO4UI3vokR0d6fxRr4zWWigFeDubT3QykQY33nP92Cx7cT7Gsgl6rR/DxejUcqXU4lD7/VhpUEQdf2/KZ+mJFrqr6xB4FWYdEj/19nzXD0F4/PpTYkLy5/z1EjLr6L/Fpri48ob6NiJuUhmfytO2GFrHlaqpxIcwifKceJa0ez1m5zurUtT4MkHUF27V+d2fxk5qqnZBen0M07R7wYNnOAEU=","iter":600000,"kid":"587c0976d0f90176"};
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("zs_keys",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function getK(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("k").objectStore("k").get(D.kid);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function putK(key){try{const db=await idb();await new Promise(res=>{const t=db.transaction("k","readwrite");t.objectStore("k").put({key:key,exp:Date.now()+30*864e5},D.kid);t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}
async function delK(){try{const db=await idb();db.transaction("k","readwrite").objectStore("k").delete(D.kid)}catch(e){}}
const dec=async key=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},key,b(D.ct)));
const show=h=>{document.open();document.write(h);document.close()};
(async()=>{
  const r=await getK();
  if(r&&r.exp>Date.now()){try{show(await dec(r.key));return}catch(e){}}
  if(r)delK();
  document.getElementById("f").hidden=false;document.getElementById("p").focus();
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const m=document.getElementById("m"),p=document.getElementById("p");m.textContent="確認中…";
  try{
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
    const html=await dec(key);
    if(document.getElementById("r").checked)await putK(key);
    show(html);
  }catch(x){m.textContent="合言葉が違います"}
});
