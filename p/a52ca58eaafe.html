const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("zs_keys",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function getK(){try{const db=await idb();return await new Promise(res=>{const q=db.transaction("k").objectStore("k").get(D.kid);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function putK(key){try{const db=await idb();await new Promise(res=>{const t=db.transaction("k","readwrite");t.objectStore("k").put({key:key,exp:Date.now()+30*864e5},D.kid);t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}
async function delK(){try{const db=await idb();db.transaction("k","readwrite").objectStore("k").delete(D.kid)}catch(e){}}
const dec=async key=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},key,b(D.ct)));
const show=h=>{document.open();document.write(h);document.close()};
(async()=>{
  const r=await getK();
  if(r&&r.exp>Date.now()){try{show(await dec(r.key));return}catch(e){}}
  if(r)delK();
  document.getElementById("f").hidden=false;document.getElementById("p").focus();
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const m=document.getElementById("m"),p=document.getElementById("p");m.textContent="確認中…";
  try{
    const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
    const html=await dec(key);
    if(document.getElementById("r").checked)await putK(key);
    show(html);
  }catch(x){m.textContent="合言葉が違います"}
});
